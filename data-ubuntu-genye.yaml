# 直接修改下面的train/val/test即可，nc是类别数，names是各个类别的名字

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
train: /workspace/Datasets/final/images/train # train images (relative to 'path') 128 images
val: /workspace/Datasets/final/images/val # val images (relative to 'path') 128 images
test: /workspace/Datasets/final/images/test # test images (relative to 'path') 128 images

# Classes
nc: 2 # number of classes
names:
  0: 00
  1: 01
