# Ultralytics YOLO11-seg instance segmentation model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/segment

# Parameters
nc: 80 # number of classes
scale: 's' # model scale: n/s/m/l/x
end2end: False # enable end-to-end NMS-free detection
reg_max: 1 # DFL bins (1 = disable DFL, direct bbox regression)
rgbd_fusion: 'coord_att_v2' # RGB-D fusion mode: 'se' | 'mamba' | 'cross_v1' | 'cross_v2' | 'coord_att' | 'coord_att_v2' | cmm
p3_wavelet_guided: True
p3_wavelet_HF: False
p3_wavelet_adaptive: False # adaptive LF+HF blend (supersedes p3_wavelet_HF)
p4_wavelet_guided: False
depth_fpn: True # lightweight top-down FPN for depth branch before fusion
modality_adaptive_gate: True # GATED-FULL: enable region gate
gate_mode: 'spatial_channel' # spatial_channel region gate (ported from ultralytics-main)
rgbd_reliability_gate: False # relative RGB-D reliability gate before fusion; False keeps the original S8 path
rgbd_reliability_mode: 'relative_soft' # soft feature scaling from RGB/depth relative reliability
cls01_weight: 1.0 # positive class-1 classification loss weight; 1.0 keeps the original loss
ol_iou: False # enable overlap-shape IoU penalty in box loss; False keeps the original CIoU loss
ol_iou_weight: 0.0 # OL-IoU penalty weight; used only when ol_iou=True
prog_loss: False # enable progressive loss balancing (ProgLoss), o2m weight decays 0.8->0.1
stal: False # enable small-target-aware label assignment (STAL)
scales: # model compound scaling constants, i.e. 'model=yolo11n-seg.yaml' will call yolo11-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 203 layers, 2876848 parameters, 2876832 gradients, 10.5 GFLOPs
  m: [0.50, 1.00, 512] # summary: 253 layers, 22420896 parameters, 22420880 gradients, 123.9 GFLOPs
  x: [1.00, 1.50, 512] # summary: 379 layers, 62142656 parameters, 62142640 gradients, 320.2 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 203 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
  l: [1.00, 1.00, 512] # summary: 379 layers, 27678368 parameters, 27678352 gradients, 143.0 GFLOPs

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2 【输出，卷积核大小，步长】
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9 取消残差，保留11的特性
  #- [-1, 1, SPPF, [1024, 5, 3, True]] # 9 和yolo26一致，加入了残差链接
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Segment, [nc, 32, 256]] # Detect(P3, P4, P5)
  
backboneD:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9 取消残差，保留11的特性
  #- [-1, 1, SPPF, [1024, 5, 3, True]] # 9 和yolo26一致，加入了残差链接
  - [-1, 2, C2PSA, [1024]] # 10
