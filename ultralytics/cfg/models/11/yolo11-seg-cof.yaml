# Ultralytics YOLO11-seg RGB-D model with COF-style PMG + MGBCF fusion.

nc: 80
scale: 's'
end2end: False
reg_max: 1

# COF / MGBCF switches
rgbd_fusion: 'cof_mgbcf'
depth_fpn: True
rgbd_pmg_aux_loss: True
rgbd_pmg_aux_loss_weight: 0.2
rgbd_pmg_aux_pos_weight: 1.0
cof_embed_ratio: 0.5
cof_min_embed: 64
cof_pmg_alpha_init: 0.5

# Keep non-COF experimental switches off for the clean COF path.
p3_wavelet_guided: False
p3_wavelet_HF: False
p3_wavelet_adaptive: False
p4_wavelet_guided: False
modality_adaptive_gate: False
rgbd_reliability_gate: False
rgbd_reliability_mode: 'relative_soft'
cls01_weight: 1.0
ol_iou: False
ol_iou_weight: 0.0
prog_loss: False
stal: False

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, Segment, [nc, 32, 256]]

backboneD:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
