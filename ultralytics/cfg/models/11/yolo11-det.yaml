# YOLO11-RGBD detection model (Detect head) with P3/8 - P5/32 outputs
# Based on yolo11-seg.yaml but uses Detect instead of Segment for detection-only benchmarks

# Parameters
nc: 80 # number of classes
scale: "x" # model scale: n/s/m/l/x
end2end: False # enable end-to-end NMS-free detection
reg_max: 1 # DFL bins (1 = disable DFL, direct bbox regression)
rgbd_fusion: "coord_att_v2" # RGB-D fusion mode: 'se' | 'mamba' | 'cross_v1' | 'cross_v2' | 'coord_att' | 'coord_att_v2' | cmm
p3_wavelet_guided: False
p3_wavelet_HF: False
p3_wavelet_adaptive: True # adaptive LF+HF blend (supersedes p3_wavelet_HF)
p4_wavelet_guided: False
depth_fpn: True # lightweight top-down FPN for depth branch before fusion
modality_adaptive_gate: False # learned modality-priority gate: α·main + (1−α)·aux + attn_out
prog_loss: False # enable progressive loss balancing (ProgLoss), o2m weight decays 0.8->0.1
stal: False # enable small-target-aware label assignment (STAL)
scales: # model compound scaling constants, i.e. 'model=yolo11n-det.yaml' will call yolo11-det.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  m: [0.50, 1.00, 512]
  x: [1.00, 1.50, 512]
  s: [0.50, 0.50, 1024]
  l: [1.00, 1.00, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)

backboneD:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
